services:
  postgres:
    image: postgres:16-alpine
    container_name: airgrid-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${AIRGRID_DB_USER:-airgrid}
      POSTGRES_PASSWORD: ${AIRGRID_DB_PASSWORD:-airgrid_local_dev_secret}
      POSTGRES_DB: ${AIRGRID_DB_NAME:-airgrid_db}
    ports:
      - "127.0.0.1:${AIRGRID_DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AIRGRID_DB_USER:-airgrid} -d ${AIRGRID_DB_NAME:-airgrid_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - airgrid-net

  api:
    build:
      context: ./apps/api
      dockerfile: ../../infrastructure/docker/Dockerfile.api
    container_name: airgrid-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "127.0.0.1:${AIRGRID_API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - airgrid-net

  web:
    build:
      context: ./apps/web
      dockerfile: ../../infrastructure/docker/Dockerfile.web
    container_name: airgrid-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "127.0.0.1:${AIRGRID_WEB_PORT:-5173}:80"
    networks:
      - airgrid-net

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: airgrid-n8n
    restart: unless-stopped
    ports:
      # Mapped to host port 5680 to avoid collisions with other running containers
      - "127.0.0.1:${AIRGRID_N8N_PORT:-5680}:5678"
    environment:
      - N8N_HOST=127.0.0.1
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://127.0.0.1:${AIRGRID_N8N_PORT:-5680}/
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - airgrid-net

volumes:
  postgres_data:
  n8n_data:

networks:
  airgrid-net:
    driver: bridge
